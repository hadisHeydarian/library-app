@if (myaction=='list') {
<div>
    <button (click)="onAdd.emit()">افزودن</button>
</div>
<table>
    <thead>
        <tr>
            @for (col of columns; track $index) {
            <th> {{col.title}} </th>
            }
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (i of data; track $index) {
        <tr>
            @for (col of columns; track $index) {
                <td>{{i[col.field]}}</td>
            }
            <td>
                <button (click)="onEdit.emit(i)">ویرایش</button>
                <button (click)="onRemove.emit(i)">حذف</button>
            </td>
        </tr>
        }
    </tbody>
</table>
}
@else {
@if (myaction=='remove') {
<div class="alert">
    ایا از حذف این کتاب اطمینان دارید؟
</div>
}
<form (ngSubmit)="onSave.emit()">
    <ng-content></ng-content>
    <div class="SaveAndCancel">
        <button (click)="onSave.emit()" type="submit">تایید</button>
        <button (click)="onCancel.emit()" type="button">انصراف</button>
    </div>
</form>

}
