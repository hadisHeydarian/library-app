@if (myaction=='list') {
<div>
    <button (click)="onAdd.emit()">افزودن</button>
</div>
<table>
    <thead>
        <tr>
            @for (col of columns; track $index) {
            <tr> {{col.title}} </tr>
            }
            <th></th>
        </tr>
        <tr>
            <!-- <th><input type="text" placeholder="شناسه"></th>
            <th><input type="text" placeholder="عنوان"></th>
            <th><input type="text" placeholder="نویسنده"></th>
            <th><input type="text" placeholder="ناشر"></th>
            <th><input type="text" placeholder="قیمت"></th>
            <th></th> -->
        </tr>
    </thead>
    <tbody>
        @for (i of data; track $index) {
        <tr>
            @for (col of columns; track $index) {
                <td>{{i[col.field]}}</td>
            }
            <td>
                <button (click)="onEdit.emit()">ویرایش</button>
                <button (click)="onRemove.emit()">حذف</button>
            </td>
        </tr>
        }
    </tbody>
</table>
}
@else {
@if (myaction=='remove') {
<div class="alert">
    ایا از حذف این کتاب اطمینان دارید؟
</div>
}
<form (ngSubmit)="onSave.emit()">
    <ng-content></ng-content>
    <div>
        <button (click)="onSave.emit()" type="button">تایید</button>
        <button (click)="onCancel.emit()" type="button">انصراف</button>
    </div>
</form>

}
